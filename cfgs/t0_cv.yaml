# experiment configuration
name: t0
save_dir: './save/'
eval_model: false # "/export/pasand/trans-hyper/save/t0pp-calhouse-finonly/epoch-10.pth"
wandb_auth: 'wandb_auth.yaml'
wandb_sweep_cfg: false # 'cfgs/sweeps/sweeptest.yaml'


# debugging configuration
debug: true
debug_datasets: false
debug_hypernet: false
debug_hyponet: false
debug_trainer: false


# hypernet configuration
hypernet:
  name: t0
  model: bigscience/T0pp


# hyponet configuration
hyponet:
  model: mlp
  in_dim: 103
  out_dim: 2
  hidden_dim: 10
  depth: 4


# tokenizer configuration
tokenizer:
  name: t0_tokenizer
  model: bigscience/T0pp
  truncation: True
  padding: max_length
  max_length: 256


# trainer configuration
trainer:
  name: t0_cv_trainer
  batch_size: 1
  n_workers: 1
  max_epoch: 200
  eval_epoch: 1
  vis_epoch: 25
  save_epoch: 1000
  optimizer:
    name: adam
    args:
      lr: 1.e-6
    

# dataset configuration
dataset:
  name: calhousing
  data_root: ./data/
  n_folds: 4
  n_shots: 6
  train_size: 8
  col_permutations:
    train: True
    val: False
    test: False
  max_n_features: 103
  balanced:
    train: True
    val: True
    test: False
  overlap_shots_queries: True
  eval_shots_from_train: True
  eval_shots_with_labels: False

  

  


