# experiment configuration
name: tabpfn-income
note: "TabPFN hypernetwork with 32-shot income dataset, without learning rate schedule"
save_dir: './save/'
eval_model: false # "/export/pasand/trans-hyper/save/t0pp-calhouse-finonly/epoch-10.pth"
wandb_auth: 'wandb_auth.yaml'
wandb_sweep_cfg: false # 'cfgs/sweeps/sweeptest.yaml'


# debugging configuration
debug: true
debug_datasets: false
debug_hypernet: false
debug_hyponet: false
debug_trainer: false


# hypernet configuration
hypernet:
  name: tabpfn


# hyponet configuration
hyponet:
  model: mlp
  in_dim: 0 # to be set from dataset
  out_dim: 2
  hidden_dim: 10
  depth: 4


# trainer configuration
trainer:
  name: tabpfn_trainer
  batch_size: 1
  n_workers: 1
  max_epoch: 300
  eval_epoch: 1
  vis_epoch: 25
  save_epoch: 500
  optimizer:
    name: adam
    args:
      lr: 1.e-4

    
# dataset configuration
datasets:
  data_root: ./data/
  n_shots: 32
  n_queries: 32
  train_ratio: None
  test_ratio: None
  train_size: 1
  val_size: 1
  test_size: 1
  train_permutation: true
  val_permutation: true
  test_permutation: false
  queries_same_as_shots: true
  max_n_features: false
  set_hyponet_indim: true

  balanced:
    train: true
    val: true
    test: false

  list_combine_train: # list of datasets to combine
    - income
        
  list_combine_val: # list of datasets to combine for validation
    - income
  
  list_combine_test: # list of datasets to combine for testing
    - income


